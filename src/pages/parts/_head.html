<style>/* critical: prevents a white flash before the gate paints */
  html,body{background:#05060A;margin:0}
  .gate{position:fixed;inset:0;z-index:100;background:#000}
  /* The gate only blocks the page once JS is running and can dismiss it.
     Previously this was unconditional, so a failed bundle left visitors
     staring at an opaque black rectangle with no way past it. */
  .gate{display:none}
  .js .gate{display:grid}
</style>
<script>document.documentElement.className += ' js'</script>
